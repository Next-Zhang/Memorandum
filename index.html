<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Memorandum · 后端联调</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head><body><main><h1>Memorandum</h1><p>Windows 备忘录 · 后端功能联调页，正式界面等待 Figma 设计。</p><p id="message" role="status"></p><div id="reminders" aria-live="assertive"></div><section><h2 id="heading">新建事项</h2><form id="form"><label>标题<input id="title" maxlength="100" required></label><label>内容<textarea id="description" maxlength="5000"></textarea></label><label>提醒时间<input id="due" type="datetime-local"></label><label>标签<select id="tag"><option>工作</option><option>生活</option><option>学习</option></select></label><label><input id="important" type="checkbox">重要事项</label><button type="submit">保存</button><button type="button" id="reset">清空并新建</button></form></section><section><h2>事项</h2><div class="tools"><input id="search" placeholder="搜索标题、内容、标签" aria-label="搜索"><select id="view" aria-label="范围"><option value="all">全部</option><option value="today">今日</option><option value="important">重要</option><option value="upcoming">即将到来</option><option value="completed">已完成</option></select><select id="status" aria-label="状态"><option value="pending">待处理</option><option value="all">所有状态</option><option value="completed">已完成</option></select></div><div id="items"></div></section><section><h2>设置与数据</h2><label><input id="notifications" type="checkbox">到期提醒</label><label><input id="closeToTray" type="checkbox">关闭窗口后留在托盘</label><label><input id="launchAtLogin" type="checkbox">开机启动</label><button id="export">导出备份</button><button id="import">导入备份</button><p>数据目录：<span id="data-path"></span></p><small>托盘常驻时继续提醒；完全退出或休眠期间不会提醒，恢复运行后补发。</small></section></main><dialog id="delete-dialog"><h2>确认删除？</h2><p id="delete-title"></p><button id="cancel-delete">取消</button><button id="confirm-delete">删除</button></dialog></body></html>
